services:
  - type: web
    name: bolao-champions
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.4
